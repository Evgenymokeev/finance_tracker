services:

  db:
    image: postgres:17
    container_name: finance_tracker_db
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    container_name: finance_tracker_redis
    restart: always

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build: .

    container_name: finance_tracker_web

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:

      db:
        condition: service_healthy

      redis:
        condition: service_healthy


  worker:
    build: .

    container_name: finance_tracker_worker

    command: celery -A config worker -l info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:

      db:
        condition: service_healthy

      redis:
        condition: service_healthy


volumes:

  postgres_data: